[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.6",
    "croniter>=6.2.4",
    "dj-database-url>=3",
    "django>=6.0,<7",
    "django-anymail>=15.2",
    "django-ninja>=1.7.3",
    "django-phonenumber-field[phonenumberslite]>=9.0.0",
    "django-post-office>=3.12.0",
    "django-s3file>=7.2.0",
    "django-storages[s3]>=1.14.6",
    "django-tasks-db>=0.13.0",
    "granian>=2.8.8",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "requests>=2.32",
    "sentry-sdk[django]>=2.75.0",
    "structlog>=26.1.0",
    "tink>=1.16.1",
]

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "import-linter>=2.16",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "DJ",      # Django
]

[tool.ruff.lint.per-file-ignores]
# Django's generated settings have long lines (validator paths, doc URLs).
"config/settings.py" = ["E501"]
# Generated by makemigrations.
"**/migrations/*" = ["E501", "I001"]

# The import rules of docs/architecture.md, checked by `make lint` and CI.
[tool.importlinter]
root_packages = ["apps", "modules", "config"]

[[tool.importlinter.contracts]]
name = "Modules don't import apps or config"
type = "forbidden"
source_modules = ["modules"]
forbidden_modules = ["apps", "config"]

[[tool.importlinter.contracts]]
name = "Modules don't import each other (only the shared signals)"
type = "independence"
modules = ["modules.*"]
ignore_imports = [
    "modules.** -> modules.signals.**",
    # Tests of how two modules work together, skipped when the other is out.
    "modules.log.tests -> modules.cron.**",
    "modules.queue.tests -> modules.mail.**",
]

# `make test-back` prints it: the number and the lines no test runs. No minimum.
[tool.coverage.run]
source = ["apps", "modules", "config"]
omit = ["*/migrations/*", "*/tests.py", "*/tests/*"]
# `manage.py test --parallel` runs the tests in worker processes, and the
# email concurrency test starts real ones: measure them all.
concurrency = ["multiprocessing"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
